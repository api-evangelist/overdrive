aid: overdrive
name: OverDrive
description: >-
  OverDrive is a digital reading platform that distributes ebooks, audiobooks,
  and magazines to public libraries and schools worldwide, best known for its
  Libby and Sora reading apps. OverDrive publishes a set of REST APIs that let
  library systems, integrators, and partners work against a library's OverDrive
  collection: Discovery APIs (Library Account, Search, Metadata, and Library
  Availability), Circulation APIs (patron information, checkouts, and holds),
  Reporting APIs (checkouts report), and a Title Link API. Access is authorized
  with OAuth 2.0 client-credentials (client authentication) for discovery and
  patron authentication (including QR-code sign-in) for borrowing and holds,
  with a dedicated integration environment for testing against real titles
  before going live.
